name: C/C++ CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  # ─── 1. Build ─────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          autotools-dev pkg-config \
          libjsoncpp-dev libgnutls28-dev libecpg-dev

    - name: Build and install flight-safety-system
      run: |
        git clone --branch develop --depth 1 \
          https://github.com/canterbury-air-patrol/flight-safety-system.git /tmp/fss
        cd /tmp/fss
        ./autogen.sh
        ./configure
        make -j$(nproc)
        sudo make install
        sudo ldconfig

    - name: autogen
      run: ./autogen.sh

    - name: configure
      run: ./configure

    - name: make
      run: make -j$(nproc)

  # ─── 2. Static analysis ───────────────────────────────────────────────────
  static-analysis:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v6

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          autotools-dev pkg-config \
          libjsoncpp-dev libgnutls28-dev libecpg-dev \
          clang-tidy bear

    # clang-format output is not stable across major versions; pin the exact
    # version the tree is formatted with so the gate is reproducible.
    - name: Install pinned clang-format
      run: |
        python3 -m venv /tmp/clang-format-venv
        /tmp/clang-format-venv/bin/pip install -q clang-format==22.1.5

    - name: Build and install flight-safety-system
      run: |
        git clone --branch develop --depth 1 \
          https://github.com/canterbury-air-patrol/flight-safety-system.git /tmp/fss
        cd /tmp/fss
        ./autogen.sh
        ./configure
        make -j$(nproc)
        sudo make install
        sudo ldconfig

    - name: autogen
      run: ./autogen.sh

    - name: configure
      run: ./configure

    - name: build with compile DB
      run: bear -- make -j$(nproc)

    - name: code checks (clang-format, clang-tidy)
      run: CLANG_FORMAT=/tmp/clang-format-venv/bin/clang-format ./check-code.sh
