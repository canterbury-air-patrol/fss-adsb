name: C/C++ CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

# Least privilege for GITHUB_TOKEN: every job here only reads the repository
# (checkout, build, test). Set at the workflow level so all jobs inherit it.
permissions:
  contents: read

# The FSS resolve/cache/build-install/autogen boilerplate that every job shares
# lives in the local composite action .github/actions/setup-fss. Jobs check out
# the repo first (so the action is present) then `uses: ./.github/actions/setup-fss`.

jobs:
  # ─── 1. Build ─────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-fss

    - name: configure
      run: ./configure

    - name: make
      run: make -j$(nproc)

  # ─── 2. Static analysis ───────────────────────────────────────────────────
  static-analysis:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-fss
      with:
        extra-packages: bear cppcheck

    # clang-format output is not stable across major versions; pin the exact
    # version the tree is formatted with so the gate is reproducible.
    - name: Install pinned clang-format
      run: |
        python3 -m venv /tmp/clang-format-venv
        /tmp/clang-format-venv/bin/pip install -q clang-format==22.1.5

    # clang-tidy's diagnostics also vary across versions; pin clang-tidy to the
    # same LLVM series the tree is kept clean against. check-code.sh invokes
    # this binary directly (see CLANG_TIDY), so no matching run-clang-tidy is
    # needed.
    - name: Install pinned clang-tidy
      run: |
        python3 -m venv /tmp/clang-tidy-venv
        /tmp/clang-tidy-venv/bin/pip install -q clang-tidy==22.1.0.1

    - name: configure
      run: ./configure

    - name: build with compile DB
      run: bear -- make -j$(nproc)

    - name: code checks (clang-format, cppcheck, clang-tidy)
      run: CLANG_FORMAT=/tmp/clang-format-venv/bin/clang-format CLANG_TIDY=/tmp/clang-tidy-venv/bin/clang-tidy ./check-code.sh

  # ─── 3. ThreadSanitizer ───────────────────────────────────────────────────
  # fss-adsb is multithreaded (dump1090 receive thread + main thread); run the
  # tests under TSan to catch data races. The flags are passed at configure time
  # rather than via an --enable switch (fss-adsb has no such option). The
  # prebuilt flight-safety-system libraries are not instrumented, so this checks
  # races in fss-adsb's own code, which is where the threads live.
  thread-sanitizer:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-fss

    - name: configure with thread sanitizer
      run: ./configure CXXFLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1 -g" LDFLAGS="-fsanitize=thread"

    - name: make
      run: make -j$(nproc)

    - name: make check (TSan)
      run: make check

    - name: collect Catch2 traceability
      run: python3 tools/collect_catch2_traceability.py

    - name: Upload Catch2 traceability artifact
      uses: actions/upload-artifact@v7
      with:
        name: catch2-traceability
        path: src/catch2-traceability.json
        retention-days: 14

  # ─── 4. AddressSanitizer + UndefinedBehaviorSanitizer ─────────────────────
  # -Wno-maybe-uninitialized suppresses a GCC false-positive in <regex> /
  # std::function (pulled in by catch.hpp) at -O1 on GCC 16+. Leak detection is
  # off because the uninstrumented FSS/GnuTLS libraries report their own
  # allocations; leaks in fss-adsb's code are covered by the valgrind job.
  sanitizers:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-fss

    - name: configure with address and undefined-behaviour sanitizers
      run: |
        ./configure \
          CXXFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -O1 -g -Wno-maybe-uninitialized" \
          LDFLAGS="-fsanitize=address,undefined"

    - name: make
      run: make -j$(nproc)

    - name: make check (ASan + UBSan)
      env:
        ASAN_OPTIONS: detect_leaks=0
        UBSAN_OPTIONS: print_stacktrace=1
      run: make check

  # ─── 5. Valgrind ──────────────────────────────────────────────────────────
  unit-tests-valgrind:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-fss
      with:
        extra-packages: valgrind

    - name: configure
      run: ./configure

    - name: build test binary
      run: make -C src -j$(nproc) test_dump1090

    # --track-fds=yes makes leaked file descriptors errors too (valgrind
    # >= 3.22 routes them through the normal error machinery), guarding the
    # one-close-per-connection invariant in dump1090's reconnect handling.
    - name: valgrind
      run: |
        valgrind \
          --leak-check=full \
          --track-fds=yes \
          --error-exitcode=1 \
          src/test_dump1090

  # ─── 6. Catch2 v2 fallback ────────────────────────────────────────────────
  # Every job above runs on ubuntu-latest, which ships Catch2 v3, so they all
  # take configure.ac's catch2-with-main branch. Debian bookworm ships only
  # Catch2 v2 and takes the vendored src/test/catch.hpp + test_main.cpp branch
  # instead -- and nothing exercised that branch until a bookworm/armhf package
  # build hit it in Jenkins at release time, which is the worst moment to find
  # it has rotted against a newer compiler. This job builds and runs the suite
  # through it on every push.
  #
  # The fallback is forced by removing the runner's catch2 package rather than
  # by pointing PKG_CONFIG_PATH somewhere empty: PKG_CONFIG_PATH is *prepended*
  # to pkg-config's built-in search path, so it cannot hide a system
  # catch2-with-main.pc, and PKG_CONFIG_LIBDIR, which can, would also hide the
  # fss-* modules configure genuinely needs. Removing the package reproduces
  # what bookworm actually looks like: no v3 pkg-config module at all.
  #
  # A job that quietly built against v3 anyway would be worse than no job -- it
  # would look like coverage -- so the branch taken is asserted three times:
  # catch2-with-main invisible to pkg-config before ./configure, the generated
  # src/Makefile carrying the test_main.cpp sources, and an actual test_main
  # object in the built tree.
  catch2-v2-fallback:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-fss

    - name: hide system Catch2 v3
      run: |
        sudo apt-get remove -y catch2
        if pkg-config --exists catch2-with-main; then
          echo "::error::catch2-with-main is still visible to pkg-config; ./configure would take the v3 branch and this job would not exercise the fallback."
          exit 1
        fi

    - name: configure
      run: ./configure

    # Automake comments out the branch of an AM_CONDITIONAL that was not taken,
    # so an *uncommented* test_dump1090_SOURCES naming test/test_main.cpp is
    # proof HAVE_CATCH2_V3 came out false.
    - name: assert the vendored Catch2 v2 branch was selected
      run: |
        if ! grep -qE '^test_dump1090_SOURCES.*test/test_main\.cpp' src/Makefile; then
          echo "::error::src/Makefile did not select the vendored Catch2 v2 sources; the fallback was not exercised."
          grep -n 'catch2-with-main' config.log || true
          grep -n 'test_dump1090_SOURCES' src/Makefile || true
          exit 1
        fi

    # test_dump1090 is a check_PROGRAM, so a plain `make` does not build it;
    # build it explicitly (as the valgrind job does) rather than relying on
    # `make check` to do it, so the object assertion below has something to
    # look at. Building fss-adsb itself adds nothing here -- the Catch2 branch
    # only ever changes the test target -- and job 1 already covers it.
    - name: build test binary
      run: make -C src -j$(nproc) test_dump1090

    # Belt and braces on the assertion above: the Makefile can say what it
    # likes, this checks what the compiler was actually handed. The object name
    # is globbed because automake prefixes it when per-target flags are in play
    # (src/test/dump1090-test_main.o as things stand).
    - name: assert test_main.cpp was compiled
      run: |
        if [ -z "$(find src -name '*test_main*.o' -print -quit)" ]; then
          echo "::error::no test_main object in the built tree; the vendored Catch2 v2 main was not compiled."
          exit 1
        fi

    - name: make check (vendored Catch2 v2)
      run: make check
