name: Docker Build and Push

on:
  push:
    branches:
      - develop
      - 'release/[0-9]*'
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

# Checkout only; DockerHub access is via secrets, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    # trixie/resolute are the same distro pair flight-safety-system's
    # docker-build.yml publishes; bookworm is here because it is the
    # Dockerfile's own ARG BASE default, i.e. what `docker build docker/`
    # produces for a developer with no --build-arg. Without it the default
    # path was the one path CI never exercised, and bookworm is also the
    # oldest base the tree supports (Catch2 v2 only, still an armhf package
    # target), so it is the most likely of the three to break first.
    # One parameterized Dockerfile instead of per-distro copies: the only
    # per-distro difference here is the base image, passed as BASE.
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: bookworm
            base: debian:bookworm
          - distro: trixie
            base: debian:trixie
          - distro: resolute
            base: ubuntu:resolute

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          IMAGE="canterburyairpatrol/fss-adsb"
          ref="${GITHUB_REF}"
          if [[ "$ref" == "refs/heads/develop" ]]; then
            sha="${GITHUB_SHA::7}"
            echo "tags=${IMAGE}:latest-${DISTRO},${IMAGE}:${sha}-${DISTRO}" >> "$GITHUB_OUTPUT"
          elif [[ "$ref" == refs/heads/release/* ]]; then
            ver="${ref#refs/heads/release/}"
            echo "tags=${IMAGE}:${ver}-${DISTRO}" >> "$GITHUB_OUTPUT"
          elif [[ "$ref" == refs/tags/v* ]]; then
            ver="${ref#refs/tags/v}"
            echo "tags=${IMAGE}:${ver}-${DISTRO}" >> "$GITHUB_OUTPUT"
          elif [[ "$ref" == refs/tags/* ]]; then
            ver="${ref#refs/tags/}"
            echo "tags=${IMAGE}:${ver}-${DISTRO}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BASE=${{ matrix.base }}
          push: ${{ steps.tags.outputs.tags != '' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}

      - name: Verify push succeeded
        if: ${{ steps.tags.outputs.tags == '' }}
        run: |
          echo "::error::No tags were computed for ref ${GITHUB_REF} — image was built but not pushed."
          exit 1
